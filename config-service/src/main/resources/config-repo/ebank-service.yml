spring:
  cloud:
    openfeign:
      client:
        config:
          customer-service:
            connectTimeout: 1500
            readTimeout: 2000
resilience4j:
  circuitbreaker:
    instances:
      customerLookup:
        slidingWindowSize: 10
        ignoreExceptions:
          - feign.FeignException$NotFound
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      customerLookup:
        timeoutDuration: 3s
