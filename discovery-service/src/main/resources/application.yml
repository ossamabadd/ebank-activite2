server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${DISCOVERY_PORT:8761}
spring:
  application:
    name: discovery-service
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
