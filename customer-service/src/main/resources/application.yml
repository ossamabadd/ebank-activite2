server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${CUSTOMER_PORT:8081}
spring:
  application:
    name: customer-service
  config:
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:h2:mem:customers;DB_CLOSE_DELAY=-1}
    username: sa
    password: ${CUSTOMER_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  ai:
    mcp:
      server:
        name: customer-service
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: ${SERVICE_HOST:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  seed-data: ${SEED_DATA:true}
